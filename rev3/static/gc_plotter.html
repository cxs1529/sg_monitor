<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GC Data Plotter</title>
    
    <!-- Plotly.js for interactive charting -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: #f8f9fa;
        }

        #sidebar {
            width: 350px;
            background-color: #ffffff;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            z-index: 10;
        }

        #plot-area {
            flex-grow: 1;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        h2, h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
        }

        h3 {
            font-size: 14px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 10px;
            font-family: monospace;
            font-size: 11px;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            white-space: pre;
        }

        button {
            width: 100%;
            padding: 8px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 15px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Filter / Checkbox Styles */
        #filter-container {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
            background-color: #fcfcfc;
        }

        .filter-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .filter-item input {
            margin-right: 8px;
            cursor: pointer;
        }

        .filter-item label {
            cursor: pointer;
            flex-grow: 1;
        }

        .select-controls {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .btn-small {
            background-color: #6c757d;
            font-size: 11px;
            padding: 4px;
            margin-bottom: 0;
        }

        .btn-small:hover {
            background-color: #5a6268;
        }

        #plotDiv {
            width: 100%;
            height: 100%;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        .status-msg {
            font-size: 12px;
            color: #28a745;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>GC Data Plotter</h2>
        <textarea id="csvInput" spellcheck="false" placeholder="Paste $GCHEAD and $GC lines here..."></textarea>
        
        <button onclick="parseAndPlot()">Process & Plot Data</button>
        <div id="statusMsg" class="status-msg"></div>

        <h3>Filter Variables</h3>
        <div class="select-controls">
            <button class="btn-small" onclick="selectAll(true)">Select All</button>
            <button class="btn-small" onclick="selectAll(false)">Clear All</button>
        </div>
        <div id="filter-container">
            <i style="font-size:12px; color:#777;">Paste data and click process to see variables...</i>
        </div>
    </div>

    <div id="plot-area">
        <div id="plotDiv"></div>
    </div>

    <script>
        // Default Header fallback in case it's missing from the pasted text
        const DEFAULT_HEADER = "$GCHEAD,st_secs,flags,vbd_ctl,pitch_ctl,roll_ctl,vbd_ad_start,vbd_pot1_ad_start,vbd_pot2_ad_start,pitch_ad_start,roll_ad_start,depth,ob_vertv,data_pts,end_secs,vbd_secs,pitch_secs,roll_secs,vbd_i,pitch_i,roll_i,vbd_ad,vbd_pot1_ad,vbd_pot2_ad,pitch_ad,roll_ad,vbd_errors,pitch_errors,roll_errors,vbd_volts,pitch_volts,roll_volts".split(',');

        let parsedData = {};
        let xData = [];
        let availableVariables = [];

        function parseAndPlot() {
            const text = document.getElementById('csvInput').value.trim();
            const lines = text.split('\n');
            
            let headers = [];
            parsedData = {};
            xData = [];
            availableVariables = [];

            // 1. Identify Headers
            for (let line of lines) {
                if (line.startsWith('$GCHEAD')) {
                    headers = line.trim().split(',');
                    break;
                }
            }
            if (headers.length === 0) headers = DEFAULT_HEADER;

            // 2. Initialize data arrays for each header (skip $GCHEAD and st_secs)
            headers.forEach((h, i) => {
                if (i > 1) { // Index 0 is $GCHEAD, Index 1 is st_secs
                    parsedData[h] = [];
                    availableVariables.push(h);
                }
            });

            // 3. Parse Data Lines
            let gcCount = 0;
            lines.forEach(line => {
                const trimmed = line.trim();
                // Filter out $STATE or any non-$GC lines
                if (trimmed.startsWith('$GC,')) {
                    const parts = trimmed.split(',');
                    if (parts.length >= headers.length) {
                        xData.push(parseFloat(parts[1])); // st_secs is always index 1
                        
                        headers.forEach((h, i) => {
                            if (i > 1) {
                                parsedData[h].push(parseFloat(parts[i]));
                            }
                        });
                        gcCount++;
                    }
                }
            });

            if (gcCount === 0) {
                document.getElementById('statusMsg').style.color = "red";
                document.getElementById('statusMsg').innerText = "Error: No valid $GC data lines found.";
                return;
            }

            document.getElementById('statusMsg').style.color = "#28a745";
            document.getElementById('statusMsg').innerText = `Successfully parsed ${gcCount} rows.`;

            buildCheckboxes();
            renderPlot();
        }

        function buildCheckboxes() {
            const container = document.getElementById('filter-container');
            container.innerHTML = ''; // clear existing

            // By default, let's select a few common ones to avoid cluttering the plot initially
            const defaultSelected = ['depth', 'pitch_ctl', 'pitch_ad', 'vbd_ctl', 'vbd_ad'];

            availableVariables.forEach(vars => {
                const isChecked = defaultSelected.includes(vars) ? 'checked' : '';
                
                const div = document.createElement('div');
                div.className = 'filter-item';
                div.innerHTML = `
                    <input type="checkbox" id="chk_${vars}" value="${vars}" ${isChecked} onchange="renderPlot()">
                    <label for="chk_${vars}">${vars}</label>
                `;
                container.appendChild(div);
            });
        }

        function selectAll(checkStatus) {
            const checkboxes = document.querySelectorAll('#filter-container input[type="checkbox"]');
            checkboxes.forEach(chk => chk.checked = checkStatus);
            renderPlot();
        }

        function renderPlot() {
            if (xData.length === 0) return;

            const traces = [];
            const checkboxes = document.querySelectorAll('#filter-container input[type="checkbox"]:checked');
            
            checkboxes.forEach(chk => {
                const varName = chk.value;
                const trace = {
                    x: xData,
                    y: parsedData[varName],
                    mode: 'lines+markers',
                    type: 'scatter',
                    name: varName,
                    marker: { size: 4 },
                    line: { width: 1.5 }
                };

                // If plotting depth, plot it on a secondary, inverted Y axis as is standard for oceanography
                if (varName === 'depth') {
                    trace.yaxis = 'y2';
                }

                traces.push(trace);
            });

            const layout = {
                title: 'GC Data Telemetry',
                xaxis: { 
                    title: 'st_secs (Time)',
                    gridcolor: '#eee'
                },
                yaxis: { 
                    title: 'Values',
                    gridcolor: '#eee'
                },
                yaxis2: {
                    title: 'Depth (m)',
                    overlaying: 'y',
                    side: 'right',
                    autorange: 'reversed', // Deepest values at the bottom
                    gridcolor: 'rgba(0,0,0,0)'
                },
                hovermode: 'closest',
                plot_bgcolor: 'white',
                paper_bgcolor: 'white',
                margin: { l: 60, r: 60, t: 50, b: 50 },
                legend: { x: 1.05, y: 1 }
            };

            const config = { responsive: true, displayModeBar: true };

            Plotly.newPlot('plotDiv', traces, layout, config);
        }

        // Initialize with default placeholder text if desired
        window.onload = function() {
            // Plotly init empty
            Plotly.newPlot('plotDiv', [], {title: 'Paste Data & Click Process to Plot'}, {responsive: true});
        };
    </script>
</body>
</html>
